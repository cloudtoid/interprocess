name: benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Interprocess.Benchmark/**'
      - '.github/workflows/benchmarks.yml'

permissions:
  contents: read

jobs:
  benchmarks:
    name: Benchmarks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run all benchmarks
        working-directory: src
        run: dotnet run --project Interprocess.Benchmark -c Release -- --filter '*' --warmupCount 3 --iterationCount 8 --artifacts BenchmarkDotNet.Artifacts
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ matrix.os }}
          path: src/BenchmarkDotNet.Artifacts/
          if-no-files-found: error
