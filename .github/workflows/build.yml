name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    name: Build and Test on ${{ matrix.os }}
    
    steps:

      - name: Checkout
        uses: actions/checkout@v7
   
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Build and Test
        run: dotnet test src/Interprocess.sln

      - name: Diagnose Windows mapping lifetime
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $failures = 0
          foreach ($revision in @('candidate', 'baseline')) {
            if ($revision -eq 'baseline') {
              git fetch origin main --depth=1
              git checkout FETCH_HEAD -- src
            }
            for ($iteration = 0; $iteration -lt 20; $iteration++) {
              Write-Output "$revision iteration $iteration"
              dotnet test src/Interprocess.Tests/Interprocess.Tests.csproj --filter FullyQualifiedName~KilledPublisherDoesNotResetSurvivingSubscriberAsync
              if ($LASTEXITCODE -ne 0) { $failures++ }
            }
          }
          Write-Output "Total failures: $failures"
          exit 0
