name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest", "macos-15-intel"]
        include:
          - os: macos-latest
            expectedArchitecture: Arm64
          - os: macos-15-intel
            expectedArchitecture: X64
    name: Build and Test on ${{ matrix.os }}
    
    steps:

      - name: Checkout
        uses: actions/checkout@v7
   
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Build and Test
        env:
          INTERPROCESS_TEST_ARCHITECTURE: ${{ matrix.expectedArchitecture }}
        run: dotnet test src/Interprocess.sln
